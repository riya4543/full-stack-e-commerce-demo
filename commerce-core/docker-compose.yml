services:
  api:
    build: .
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/commerce?schema=public
      JWT_SECRET: replace-with-a-32-character-secret-value
    depends_on: [db]
  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment: { POSTGRES_DB: commerce, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes: { postgres_data: {} }
